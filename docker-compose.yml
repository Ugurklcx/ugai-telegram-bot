version: '3.8'

services:
  ugai_bot:
    build: .
    container_name: ugai_telegram_bot
    restart: always  
    env_file:
      - .env        
    volumes:
      
      - ./Database.db:/app/Database.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"